# Simple Chat Server Configuration
# Profile: 환경변수 SPRING_PROFILES_ACTIVE로 설정 (기본값: dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Common Configuration
server.port=${PORT:8080}
spring.application.name=simple-chat-server

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# WebSocket Configuration
spring.websocket.message-size-limit=65536
websocket.session.idle-timeout-minutes=${WS_IDLE_TIMEOUT:30}

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul

# Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics,env,loggers
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Health Groups for Kubernetes probes
management.endpoint.health.group.liveness.include=ping,diskSpace
management.endpoint.health.group.readiness.include=db,webSocket,storage
management.endpoint.health.group.liveness.show-details=always
management.endpoint.health.group.readiness.show-details=always

# Application Info
management.info.env.enabled=true
info.app.name=BEAM Messenger
info.app.description=Real-time chat application
info.app.version=1.0.0
info.app.encoding=UTF-8
info.app.java.version=${java.version}

# Security Configuration
# CORS: Set via environment variable in production (comma-separated domains)
# Example: CORS_ALLOWED_ORIGINS=https://beam.chat,https://www.beam.chat
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

# SECURITY WARNING: JWT secret MUST be set via environment variable
# Generate a secure random 256-bit key: openssl rand -base64 64
# Minimum length: 32 characters (256 bits)
# For development, set JWT_SECRET in .env or environment
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# File Storage
file.upload-dir=uploads
file.max-size=10485760

# Logging
logging.level.com.beam=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Flyway Database Migration - Disabled by default (using JPA ddl-auto)
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Rate Limiting - General API
rate.limit.api.capacity=100
rate.limit.api.refill-tokens=100
rate.limit.api.refill-duration-minutes=1
rate.limit.websocket.capacity=50
rate.limit.websocket.refill-tokens=50
rate.limit.websocket.refill-duration-seconds=10

# Rate Limiting - Authentication (brute-force protection)
rate.limit.auth.max-attempts=5
rate.limit.auth.lockout-minutes=15
rate.limit.auth.verification-max-attempts=3
rate.limit.auth.verification-lockout-minutes=60

# Email Configuration (Gmail SMTP example)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# NCP SMS Configuration (optional, for future use)
ncp.sms.access-key=${NCP_ACCESS_KEY:}
ncp.sms.secret-key=${NCP_SECRET_KEY:}
ncp.sms.service-id=${NCP_SMS_SERVICE_ID:}
ncp.sms.sender-phone=${NCP_SENDER_PHONE:}

# App Configuration
app.name=BEAM

# Guest Configuration
app.guest.max-id=10000
app.room.default-max-members=1000

# Pagination Configuration
app.page.default-size=100
app.page.max-size=500

# File Processing Configuration
file.thumbnail.width=200

# Search Configuration
app.search.max-keyword-length=100

# Health Indicator Thresholds
health.database.slow-query-threshold-ms=100
health.database.critical-query-threshold-ms=500
health.websocket.max-sessions-warning=5000
health.websocket.max-sessions-critical=10000

# Message Encryption Configuration
# SECURITY WARNING: Master key MUST be set via environment variable in production
# Generate a secure key: openssl rand -base64 32
encryption.master-key=${ENCRYPTION_MASTER_KEY:}
encryption.enabled=${ENCRYPTION_ENABLED:false}

# Caching Configuration
spring.cache.type=caffeine
spring.cache.cache-names=users,chatRooms,messages,friends
spring.cache.caffeine.spec=expireAfterWrite=30m,maximumSize=1000

# Google Cloud Translation Configuration
translation.enabled=${TRANSLATION_ENABLED:false}
google.cloud.project-id=${GOOGLE_CLOUD_PROJECT_ID:}
google.cloud.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}

# Default to dev profile if not specified (환경변수 우선)
spring.profiles.default=dev

# H2 Console 비활성화 (프로덕션 보안)
spring.h2.console.enabled=false