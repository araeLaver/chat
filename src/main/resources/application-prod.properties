# Production Profile Configuration
server.port=${PORT:8080}

# CORS Configuration - 환경변수로 설정하거나 기본값 사용
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://chat-untab-fddd496d.koyeb.app}

# PostgreSQL Database Configuration
# 환경변수 DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD 필요
# Koyeb PostgreSQL 기본값 설정
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-divine-bird-a1f4mly5.ap-southeast-1.pg.koyeb.app/unble?currentSchema=chat&sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:unble}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# DataSource 자동 구성 강제
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=chat

# 스키마 자동 생성 (없으면 생성)
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# SQL initialization - 스키마 생성만 실행
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-only.sql
spring.sql.init.continue-on-error=true

# Connection Pool Configuration (Production optimized)
# 동시 사용자 처리를 위해 풀 크기 증가 (10 -> 30)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
# 커넥션 누수 감지 (2분 이상 사용 시 경고)
spring.datasource.hikari.leak-detection-threshold=120000

# Logging (Production - minimal)
logging.level.root=WARN
logging.level.com.beam=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SSL Configuration for PostgreSQL
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# Performance tuning
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Database Migration
spring.flyway.enabled=true
spring.flyway.schemas=chat

# Actuator & Monitoring (Production - minimal exposure)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Disable sensitive endpoints in production
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.beans.enabled=false

# =====================================================
# Security: Cookie & HTTPS Configuration
# =====================================================

# Session Cookie Security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Proxy Configuration (for Koyeb, Heroku, AWS ELB, etc.)
# Enables correct HTTPS detection behind reverse proxy
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For

# HSTS (HTTP Strict Transport Security) - handled by reverse proxy
# If using Spring Security, enable HSTS headers:
# security.headers.hsts.enabled=true